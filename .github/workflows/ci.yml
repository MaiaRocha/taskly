name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Cancels a still-running run for the same branch/PR when a newer push
# arrives, instead of letting both finish — avoids wasting runner minutes on
# a result that's about to be superseded anyway.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (PHP)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # mbstring/xml/ctype/fileinfo confirmed via `composer check-platform-reqs`
          # against this project's actual dependency tree; pdo/pdo_sqlite are needed
          # separately because the test suite runs against SQLite in-memory
          # (phpunit.xml), which composer's own platform check doesn't cover.
          extensions: mbstring, xml, ctype, fileinfo, pdo, pdo_sqlite
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # No .env is committed to the repo. APP_KEY is genuinely required here,
      # not just a precaution — verified locally: running the suite without
      # any APP_KEY fails 12 tests with "No application encryption key has
      # been specified" (session/cookie encryption, used by Sanctum's
      # stateful SPA auth). Every other test-relevant value (DB connection,
      # cache, session driver, mail) is already overridden by phpunit.xml's
      # own <php> block regardless of what .env.example sets them to, so
      # nothing else from .env is actually needed. The key is generated
      # fresh on the runner's disposable filesystem each run — never a
      # committed or reused secret.
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check code style (Pint)
        run: vendor/bin/pint --test

      - name: Run test suite (Pest)
        run: php artisan test --compact

  frontend:
    name: Frontend (Node)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Type-check (vue-tsc)
        run: npx vue-tsc --noEmit

      - name: Build
        run: npm run build
